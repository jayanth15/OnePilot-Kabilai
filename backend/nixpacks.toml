# Nixpacks config for the Kabilai backend (FastAPI + SQLModel + Pydantic AI).
# Deployed from the `backend/` directory. Sets up Python, installs deps with uv,
# and runs the API on APP_PORT.
#
# The database selects Postgres or SQLite at RUNTIME via env vars:
#   PROD_DB=true  +  DATABASE_URL  -> Postgres
#   PROD_DB=false (default)        -> local SQLite
# Tables are created automatically on app startup. No base data is seeded at
# startup — seed once manually (or manage the DB directly).

[variables]
APP_PORT = "8000"
PYTHON_VERSION = "3.13"
# PROD_DB and DATABASE_URL are supplied by the platform at deploy/runtime.

[phases.setup]
nixPkgs = ["python313", "gcc", "uv"]

[phases.install]
cmds = [
  # Create a shared, writable venv for the running app
  "python -m venv --copies /opt/venv",
  "uv pip install --python /opt/venv/bin/python -r requirements.txt",
  "mkdir -p data"
]

[start]
# Use uvicorn directly (module `app` exposes the FastAPI app as `app`).
# Startup only creates missing tables via the lifespan hook (no data seeding).
cmd = "/opt/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port ${APP_PORT:-8000}"
